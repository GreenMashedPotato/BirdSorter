[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0-or-later"
repository = "https://github.com/GreenMashedPotato/raw-sorter-app"
authors = ["GreenMashedPotato"]

[workspace.dependencies]
# --- core runtime ---
ndarray = "0.17"
rayon = "1.10"
rustfft = "6.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rusqlite = { version = "0.39", features = ["bundled"] }
walkdir = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
image = "0.25"
rawler = "0.8.0"
demosaic = "0.3"
sha2 = "0.11"
ureq = "3"
zip = "2"
trash = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs4 = "1.1"

# --- dev ---
approx = "0.5"
proptest = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Benchmarks want optimised code but not the release profile's slow LTO.
[profile.bench]
lto = false
codegen-units = 16
opt-level = 3
