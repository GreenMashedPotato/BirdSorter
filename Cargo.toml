[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0-or-later"
repository = "https://github.com/GreenMashedPotato/raw-sorter-app"
authors = ["GreenMashedPotato"]

[workspace.dependencies]
# --- core runtime ---
ndarray = "0.16"
rayon = "1.10"
rustfft = "6.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
time = { version = "0.3", features = ["formatting"] }

# --- dev ---
approx = "0.5"
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
