name: Release

# Manual/tag only, deliberately: every run spends billed minutes, and the macOS
# bundling jobs cost 10x the Linux rate. See the cost note in ci.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# tauri-action publishes the installers as release assets, which needs write.
permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--config tauri.signing.json"
          - os: macos-14
            args: "--target aarch64-apple-darwin"
          - os: macos-13
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend
        working-directory: ui
        run: npm ci && npm run build

      # Windows: import the .pfx (if the secret is set) and write a config that
      # Tauri merges over tauri.conf.json, so both the app exe and the
      # installers are signed. With no secret it writes `{}` and builds
      # unsigned, so forks/PRs keep working. See SIGNING.md.
      - name: Configure Windows code signing
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PW: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $cfg = "{}"
          if ($env:CERT_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP "birdsorter.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            $secure = ConvertTo-SecureString $env:CERT_PW -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure | Out-Null
            $cert = Get-PfxCertificate -FilePath $pfx -Password $secure
            $cfg = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $cert.Thumbprint
                  digestAlgorithm       = "sha256"
                  timestampUrl          = "http://timestamp.digicert.com"
                }
              }
            } | ConvertTo-Json -Depth 6 -Compress
            Write-Host "Windows signing enabled: $($cert.Subject) [$($cert.Thumbprint)]"
          } else {
            Write-Host "WINDOWS_CERTIFICATE not set - building unsigned."
          }
          Set-Content -Path tauri.signing.json -Value $cfg -Encoding utf8

      # macOS signing + notarization are driven by env vars: Tauri imports the
      # .p12 into a temporary keychain and notarizes with notarytool. All of
      # these are optional; without them the mac builds are unsigned.
      # Bundles the default flavour (detector only): the CI runners do not have
      # the 820 MB species model, which is gitignored. For a model-bundled
      # installer, build locally with `--config tauri.models.conf.json` (see
      # README ▸ Building installers).
      - name: Build bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: crates/desktop
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.os }}
          path: |
            target/release/bundle/**
          if-no-files-found: error
