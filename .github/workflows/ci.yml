name: CI

# Windows, Linux and macOS all run the core tests: the app ships on Windows and
# macOS, and macOS path handling (canonicalize, verbatim prefixes) is not
# exercised anywhere else. Public-repository runner minutes are free, so the old
# "macOS is expensive" note no longer applies.
on:
  push:
    branches: [main]
    # Documentation-only changes should not spend CI minutes.
    paths-ignore:
      - "**/*.md"
      - "dist-models/**"
      - "models/**"
      - "LICENSE*"
  pull_request:

# A new push to the same branch cancels the previous run, so a rapid series of
# commits cannot multiply the bill.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: every job just checks out and builds. Pinned here so a change to
# the repository default cannot hand the token more than it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (core + cli)
        run: cargo clippy --locked -p birdsorter-core -p birdsorter-cli --all-targets -- -D warnings

      - name: Unit tests (core + cli)
        run: cargo test --locked -p birdsorter-core -p birdsorter-cli

      # The optional HEIC decoder is a security-sensitive input path; compile
      # and test it on one platform so the feature cannot rot.
      - name: Unit tests (heic feature)
        if: runner.os == 'Linux'
        run: cargo test --locked -p birdsorter-core --features heic

      - name: Pipeline self-test
        run: cargo run --locked -p birdsorter-cli -- selftest

  core-macos:
    name: core (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (core)
        run: cargo clippy --locked -p birdsorter-core --all-targets -- -D warnings

      - name: Unit tests (core)
        run: cargo test --locked -p birdsorter-core

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Version consistency
        run: node scripts/version.mjs check
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Type-check
        working-directory: ui
        run: npx svelte-check --tsconfig ./tsconfig.json
      - name: Unit tests
        working-directory: ui
        run: npm test
      - name: Build
        working-directory: ui
        run: npm run build

  desktop:
    name: desktop (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        working-directory: ui
        run: npm ci && npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Clippy is a superset of `cargo check` and the local gates lint the whole
      # workspace; without this the Tauri adapter was only compile-checked here.
      - name: Clippy (desktop)
        run: cargo clippy --locked -p birdsorter-desktop --all-targets -- -D warnings

      - name: Unit tests (desktop)
        run: cargo test --locked -p birdsorter-desktop
