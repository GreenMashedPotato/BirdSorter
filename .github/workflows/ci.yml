name: CI

# Cost note: this repo is private, so Actions minutes are billed (macOS at 10x
# the Linux rate). The matrix is therefore deliberately small - Linux + Windows
# only. macOS is validated by hand (see MACOS_TODO.md) instead of per-push.
on:
  push:
    branches: [main]
    # Documentation-only changes should not spend CI minutes.
    paths-ignore:
      - "**/*.md"
      - "dist-models/**"
      - "models/**"
      - "LICENSE*"
  pull_request:

# A new push to the same branch cancels the previous run, so a rapid series of
# commits cannot multiply the bill.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (core + cli)
        run: cargo clippy -p birdsorter-core -p birdsorter-cli --all-targets -- -D warnings

      - name: Unit tests (core + cli)
        run: cargo test -p birdsorter-core -p birdsorter-cli

      - name: Pipeline self-test
        run: cargo run -p birdsorter-cli -- selftest

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Type-check
        working-directory: ui
        run: npx svelte-check --tsconfig ./tsconfig.json
      - name: Build
        working-directory: ui
        run: npm run build

  desktop:
    name: desktop (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        working-directory: ui
        run: npm ci && npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check desktop crate
        run: cargo check -p birdsorter-desktop
